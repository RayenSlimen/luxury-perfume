kind = "web"
previewPath = "/"
title = "Velmora — Parfumerie de Luxe"
version = "1.0.0"
id = "artifacts/velmora"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21580

[services.development]
run = "pnpm --filter @workspace/velmora run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/velmora", "run", "build" ]
publicDir = "artifacts/velmora/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21580"
BASE_PATH = "/"
